# Local development site (Ubuntu/WSL). Production uses its own
# configuration on VMServicios (HTTPS, security headers, SELinux).
<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/jesterschest

    ScriptAlias /app.cgi /usr/lib/cgi-bin/app.cgi
    RedirectMatch ^/$ /app.cgi/catalogo

    ErrorLog ${APACHE_LOG_DIR}/jesterschest-error.log
    CustomLog ${APACHE_LOG_DIR}/jesterschest-access.log combined
</VirtualHost>
