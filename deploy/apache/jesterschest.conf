# Production site on VMServicios (Rocky Linux 9).
# Installed as /etc/httpd/conf.d/jesterschest.conf by install-vmservicios.sh.
# Apache already listens only on 192.168.160.10 (httpd.conf and ssl.conf).

ServerName www.jesterschest.internal

# Port 80 only redirects to HTTPS; it never serves content.
<VirtualHost 192.168.160.10:80>
    ServerName www.jesterschest.internal
    ServerAlias jesterschest.internal
    Redirect permanent / https://www.jesterschest.internal/
</VirtualHost>

<VirtualHost 192.168.160.10:443>
    ServerName www.jesterschest.internal
    ServerAlias jesterschest.internal
    DocumentRoot /var/www/jesterschest

    # TLS with the certificate issued by the course CA (RA17).
    SSLEngine on
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLCertificateFile    /etc/pki/tls/certs/jesterschest.crt
    SSLCertificateKeyFile /etc/pki/tls/private/jesterschest.key
    # Only if the course CA signs through an intermediate certificate:
    # SSLCertificateChainFile /etc/pki/tls/certs/ca-del-curso-chain.crt

    # The application: a single CGI program (front controller).
    ScriptAlias /app.cgi /var/www/cgi-bin/app.cgi
    RedirectMatch ^/$ /app.cgi/catalogo

    <Directory /var/www/jesterschest>
        Options None
        AllowOverride None
        Require all granted
    </Directory>

    # HSTS (RA17). Short while testing; raise to 31536000 (one year) once
    # the certificate works, because browsers will refuse to bypass errors.
    Header always set Strict-Transport-Security "max-age=31536000"
    # CSP (RA6, RA18): no scripts at all for now; only our own stylesheet.
    # When the pages need JavaScript, add script-src 'self' (files only).
    Header always set Content-Security-Policy "default-src 'none'; style-src 'self'; img-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'none'"
    Header always set X-Content-Type-Options "nosniff"

    ErrorLog  logs/jesterschest-error.log
    CustomLog logs/jesterschest-access.log combined
</VirtualHost>
